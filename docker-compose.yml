version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGO_URL=${MONGO_URL:-mongodb://localhost:27017/foodiespot}
      - JWT_SECRET=${JWT_SECRET:-foodiespot_secret_key_2026}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
    restart: always
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  admin:
    build: ./admin
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend-uploads:
